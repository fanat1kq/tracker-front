events {}

http {
    include /etc/nginx/mime.types;

    upstream gateway {
        server gateway:8080;
    }

    server {
        listen 3001;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://gateway;
        }
    }
}