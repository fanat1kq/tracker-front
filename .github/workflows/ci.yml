name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/front

jobs:
  build-and-push:
    environment: task-tracker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'tracker-front/package-lock.json'  # Исправленный путь

      - name: Install dependencies
        run: npm ci
        working-directory: tracker-front  # Без точки в начале

      - name: Run tests
        run: npm test -- --coverage --watchAll=false
        working-directory: tracker-front

      - name: Build application
        run: npm run build
        working-directory: tracker-front
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: tracker-front  # Без точки в начале
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/master'
    environment: task-tracker

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"
            cd ~/app/task-tracker
            
            docker stop front || true
            docker rm front || true
            docker pull ${{ env.IMAGE_NAME }}:master
            docker-compose -f docker-compose.prod.yml up -d front